# prek.toml — pre-commit hooks configuration
# Docs: https://prek.j178.dev/configuration/
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.2"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit", "manual"]

# Vendored Ministry exam files must remain verbatim; exclude only the fixers.
# Builtin hooks — fast, offline, Rust-native
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = "^docs/proever/" },
  { id = "end-of-file-fixer", exclude = "^docs/proever/" },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = "^docs/proever/" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — enforce Conventional Commit message format
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

# This zero-build static site has no project toolchain or local quality commands.
