name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/code-quality.yml
  smoke:
    uses: ./.github/workflows/smoke.yml
  required:
    name: ci / required
    if: always()
    needs: [quality, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/gate@v4.1.1
        with:
          needs: ${{ toJSON(needs) }}
          required: quality smoke
