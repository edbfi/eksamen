# Tier-1 smoke test: serve the static docs and prove real pages load.
#
# This is a documentation-only repository: no package.json, no lockfile, no
# build step. There is deliberately no Node toolchain here — introducing one
# just to run a web server would be a bigger change than the check is worth, so
# the runner's preinstalled python3 serves docs/ directly.
#
# Deliberately NOT a browser test. It verifies that the pages are present and
# served as real HTML; it says nothing about client-side behaviour.
name: Smoke Test

on:
  workflow_call:
  workflow_dispatch:

# Read-only throughout.
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Serve · load
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Serve docs and smoke-test pages
        run: |
          set -euo pipefail

          # Bound to 127.0.0.1 explicitly so the probes below, which dial the
          # IPv4 literal, cannot miss the listener.
          python3 -m http.server 4321 --bind 127.0.0.1 --directory docs &
          server=$!
          trap 'kill "${server}" 2>/dev/null || true' EXIT

          # Readiness loop, deliberately NOT `curl --retry`: this distinguishes
          # "not up yet" from "up but broken", so a real error fails fast instead
          # of being retried into a timeout. http.server does not serve a
          # directory index redirect for `/`, so probe the file directly.
          timeout 60 bash -c 'until curl -fsS -o /dev/null http://127.0.0.1:4321/index.html; do sleep 1; done'

          # Assert on CONTENT, not just status — a 200 error page would sail
          # through a status-only check.
          #
          # The body goes to a file rather than into `curl ... | grep -q`:
          # grep -q exits at the first match, curl then dies of SIGPIPE with
          # exit 23, and `pipefail` turns that into a failure. Whether it trips
          # depends on response size and timing, so the piped form is
          # intermittently red rather than reliably broken.
          #
          # docs/proever/ is the Ministry's exam archive under its own separate
          # licence and is intentionally not probed here.
          for path in /index.html /optagelsesprover.html; do
            echo "==> ${path}"
            curl -fsS -m 10 -o "${RUNNER_TEMP}/page.html" "http://127.0.0.1:4321${path}"
            grep -qi '<html' "${RUNNER_TEMP}/page.html" \
              || { echo "SMOKE FAILED: ${path} served no <html>"; exit 1; }
          done
